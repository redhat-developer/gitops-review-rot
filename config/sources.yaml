# GitHub App credentials for API access
github:
  app_id: 4968234
  installation_id: 162260382

sources:
  # Additional repos outside the orgs above
  # Prefix a repo with + to watch ALL authors (like an org repo)
  # Without +, only PRs from team members in 'authors' are shown
  repos:
    - +redhat-developer/gitops-backend
    - +redhat-developer/gitops-console-plugin
    - +redhat-developer/gitops-must-gather
    - +redhat-developer/gitops-operator
    - argoproj/argo-cd
    - argoproj/argo-rollouts
    - +argoproj-labs/argocd-agent
    - +argoproj-labs/argocd-image-updater
    - +argoproj-labs/argocd-operator

# Reviewer leaderboard settings
leaderboard:
  # Data horizon: how many days of review history to aggregate. This is the
  # widest range the leaderboard can show; the dashboard's interval selector
  # narrows it further client-side. Defaults to 90 if omitted.
  window_days: 90

# The GitHub App must have 'Organization members: Read' permission to expand teams.
authors:
- "@redhat-developer/gitops"
